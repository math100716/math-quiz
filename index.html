<script>
/* ---------- 简易 LaTeX 兜底渲染 ---------- */
/* ---------- 数学公式渲染：分数为横线分式，指数为上标 ---------- */
function mathRender(s) {
  s = String(s)
    .replace(/\\triangle/g, "△").replace(/\\angle/g, "∠")
    .replace(/\\parallel/g, "∥").replace(/\\perp/g, "⊥")
    .replace(/\\cong/g, "≌").replace(/\\sim/g, "∽");
  // 分式 \frac{a}{b}（分子分母支持一层嵌套，如 \frac{1}{x^{2}}），递归渲染内部
  s = s.replace(/\\frac\{((?:[^{}]|\{[^{}]*\})*)\}\{((?:[^{}]|\{[^{}]*\})*)\}/g,
    (m, a, b) => '<span class="mfrac"><span class="num">' + mathRender(a) + '</span><span class="den">' + mathRender(b) + '</span></span>');
  // 指数 ^{...}（支持一层嵌套，如 x^{a^{2}﹣2a﹣6}），以及单字符指数 ^2
  s = s.replace(/\^\{((?:[^{}]|\{[^{}]*\})*)\}/g, (m, e) => '<sup>' + mathRender(e) + '</sup>');
  s = s.replace(/\^(\S)/g, (m, e) => '<sup>' + e + '</sup>');
  // 下标 _{...}
  s = s.replace(/_\{((?:[^{}]|\{[^{}]*\})*)\}/g, (m, e) => '<sub>' + mathRender(e) + '</sub>');
  s = s.replace(/\\sqrt\{((?:[^{}]|\{[^{}]*\})*)\}/g, (m, t) => '√<span class="rad">' + mathRender(t) + '</span>');
  return s.replace(/[{}]/g, "");
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) { return mathRender(esc(s)); }

const $ = id => document.getElementById(id);
const KEY = "similar-triangle-bank-v2";
const VERSION = window.BANK_VERSION || "builtin";

/* ---------- 页头信息 ---------- */
(function () {
  const m = window.BANK_META || {};
  $("crumb").textContent = m.crumb || "数学 · 随机抽题";
  $("title").textContent = m.title || "随机抽题";
  $("bankTitle").textContent = m.source || "内置题库";
})();

/* ---------- 登录校验 / 学生档案 / 积分 ---------- */
const GUEST = /[?&]guest=1/.test(location.search);
const sess = (window.Store && Store.session()) || null;
if (!GUEST && !sess) location.replace("login.html");
if (window.Store) Store.weeklyReset();   // 跨过周五 24:00 则自动清零全部积分（须在读档案前执行）
let me = (!GUEST && sess) ? Store.getUser(sess.cls, sess.name) : null;

let toastTimer = null;
function toast(text, kind) {
  const t = $("toast");
  if (!t) return;
  t.textContent = text;
  t.className = "";
  void t.offsetWidth;
  t.className = "on" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ""; }, 1600);
}

function refreshMe() {
  const bar = $("userbar");
  if (!me) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  $("who").innerHTML = esc(me.name) + '<small>' + esc(me.cls) + "</small>";
  $("scoreVal").textContent = me.score;
  $("streakVal").textContent = me.streak;
  $("scorePill").classList.toggle("zero", me.score === 0);
  $("scorePill").classList.remove("pop"); void $("scorePill").offsetWidth;
  $("scorePill").classList.add("pop");
}

/* 答对：每题固定 1 分，连对计数只做展示；
   同时把这道题从该同学的错题集里移除——这是清出错题集的唯一途径。 */
function scoreRight(q) {
  if (!me) return;
  me.streak += 1;
  me.score += 1;
  me.right += 1;
  if (me.streak > me.best) me.best = me.streak;
  let cleared = false;
  if (q && window.Store && Store.removeWrong) {
    const before = (me.wrongItems || []).length;
    Store.removeWrong(me, q.id);
    cleared = (me.wrongItems || []).length < before;
  }
  Store.saveUser(me);
  refreshMe();
  toast("答对  +1 分" + (me.streak > 1 ? "（连对 " + me.streak + " 题）" : "") + (cleared ? " · 该题已清出错题集" : ""), "ok");
}
/* 答错：积分清零、连对归零，并把这道题记入错题集（累计次数由 Store.addWrong 统一负责）。
   界面上不给任何提示（不标选项、不弹提示），学生看不到正确答案。 */
function scoreWrong(q) {
  if (!me) return;
  me.score = 0;
  me.streak = 0;
  if (q && window.Store && Store.addWrong) Store.addWrong(me, q);
  else me.wrong = (me.wrong || 0) + 1;
  Store.saveUser(me);
  refreshMe();
}

$("logout").onclick = () => {
  Store.clearSession();
  location.href = "login.html";
};
if (me) refreshMe();

/* ---------- 题库：仅当本地缓存与当前题库版本一致时才覆盖 ---------- */
/* 抽题范围：只抽选择题（填空题需要手写/小键盘作答，不参与随机抽取） */
const pickable = q => q && q.stem && q.type !== "填空" && (q.options || []).length >= 2;
let Q = (window.QUESTIONS || []).filter(pickable);
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && saved.v === VERSION && Array.isArray(saved.list) && saved.list.length) {
    const hit = saved.list.filter(pickable);
    if (hit.length) Q = hit;
  }
} catch (e) {}

const pool = [];
const drawn = [];
let current = null;
let drawnIds = new Set();
try {
  const sd = JSON.parse(localStorage.getItem(KEY + ":drawn") || "[]");
  if (Array.isArray(sd)) drawnIds = new Set(sd.map(String));
} catch (e) {}
function saveDrawn() { try { localStorage.setItem(KEY + ":drawn", JSON.stringify([...drawnIds])); } catch (e) {} }

/* 选定答案 3 秒后自动抽下一题 */
let autoTimer = null;
function armAutoNext() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { autoTimer = null; draw(); }, 3000);
}
function disarmAutoNext() { clearTimeout(autoTimer); autoTimer = null; }

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function refill() { pool.length = 0; shuffle(Q.slice()).forEach(x => pool.push(x)); }

function figsHtml(list) {
  if (!list || !list.length) return "";
  return `<div class="figs">` + list.map((s, i) =>
    `<span class="fig"><img src="${esc(s)}" alt="题图${i ? i + 1 : ""}"></span>`).join("") + `</div>`;
}

/* ---------- 填空题：按答案定制小键盘 ---------- */
/* 把答案拆成"零部件"：分式、根号、带上下标的字母、数字、中文词、单个符号各成一块，去重 */
function answerTokens(ans) {
  let s = String(ans || "");
  s = s.replace(/（答案不唯一[^）]*）/g, "").replace(/（[^）]*均可[^）]*）/g, "").trim();
  const out = [];
  const re = /\\frac\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}|\\sqrt\{[^{}]*\}|[a-zA-Z）)](?:_\{[^{}]*\})?(?:\^\{[^{}]*\})?|[0-9]+(?:\.[0-9]+)?|[\u4e00-\u9fff]+|[\s\S]/g;
  let m;
  while ((m = re.exec(s)) !== null) {
    const t = m[0];
    if (!t || /^\s$/.test(t)) continue;
    if (!out.includes(t)) out.push(t);
  }
  return out;
}

/* ---------- 选项乱序：每次抽到同一题，A/B/C/D 对应的内容都重新洗牌，防止背位置背答案 ---------- */
const OPT_LETTERS = ["A", "B", "C", "D", "E", "F"];
/* 去掉选项自带的字母前缀（A．/ A. / A、），只留正文 */
function stripOpt(s) { return String(s || "").trim().replace(/^[A-F][.．、]\s*/, ""); }
/* 返回 { items:[{k:新字母, letter:原字母, body|img}], ans:新答案字母 }；不改动题库原数据 */
function shuffledView(q) {
  const origAns = String(q.answer || "").trim().replace(/[^A-F]/g, "").charAt(0) || "";
  const hasText = (q.options || []).some(o => stripOpt(o));     // 有真实文字 → 文字选项；否则用图片选项
  const items = hasText
    ? (q.options || []).map(o => ({ letter: o.trim().charAt(0), body: stripOpt(o) }))
    : (q.optionImgs || []).map(o => ({ letter: o.label, img: o.img }));
  if (items.length < 2) return { items: items, ans: origAns };
  const order = shuffle(items.map((_, i) => i));                // 新位置 → 原索引
  const mapped = order.map((oi, pos) => {
    const it = items[oi];
    it.k = OPT_LETTERS[pos] || OPT_LETTERS[OPT_LETTERS.length - 1];
    return it;
  });
  const hit = origAns ? mapped.find(it => it.letter === origAns) : null;
  return { items: mapped, ans: hit ? hit.k : "" };
}

function render(q) {
  const card = $("card");
  if (!q) {
    card.innerHTML = `<div class="empty"><div class="big">📚</div>
      <div>题库还是空的。</div>
      <div style="margin-top:10px">展开下方「导入题库」，把题目粘进来即可。</div></div>`;
    return;
  }
  const sv = shuffledView(q);                       // 本题本轮的乱序视图（含改写后的答案字母）
  const ansLetter = sv.ans;
  const opts = sv.items.length
    ? `<div class="opts">${sv.items.map(it => {
        const label = it.body !== undefined ? it.k + "．" + it.body : it.k + "．";
        return `<div class="opt" data-k="${esc(it.k)}">${fmt(label)}</div>`;
      }).join("")}</div>` : "";
  const optImgHtml = (sv.items.length && sv.items[0].img !== undefined)
    ? `<div class="optimgs">${sv.items.map(it =>
        `<div class="optimg"><img src="${esc(it.img)}" alt="选项${esc(it.k)}"><span class="lb">${esc(it.k)}</span></div>`).join("")}</div>`
    : "";
  const stemImgs = (q.images || []).slice(0, 1);   // 只显示题图，解答配图默认隐藏
  const isFill = !(q.options || []).length && !(q.optionImgs || []).length && /_{2,}/.test(q.stem || "");
  let stemHtml;
  if (q.hideStem) stemHtml = "";
  else if (isFill) {
    const parts = q.stem.split(/_{2,}/);
    stemHtml = `<div class="stem">${fmt(parts[0])}<span class="blank" id="blankSlot"></span><span class="blank-hint">点击横线作答</span>${fmt(parts.slice(1).join("____"))}</div>`;
  } else stemHtml = `<div class="stem">${fmt(q.stem)}</div>`;
  card.innerHTML = `
    <div class="tags">
      ${q.type ? `<span class="tag">${esc(q.type)}</span>` : ""}
      ${q.level && !q.hideLevel ? `<span class="tag level-${esc(q.level)}">${esc(q.level)}</span>` : ""}
      ${q.source && !q.hideSource ? `<span class="tag src">${esc(q.source)}</span>` : ""}
    </div>
    ${stemHtml}
    ${figsHtml(stemImgs)}
    ${isFill ? `<div class="pad" id="pad" hidden></div>` : ""}
    ${optImgHtml}
    ${opts}
    ${q.hideAnswer ? "" : `
    <details class="reveal" id="rev">
      <summary>查看参考答案与解析</summary>
      <div class="ans-box">
        ${q.answer ? `<div class="row"><div class="k">答案</div><div class="v strong">${fmt(q.answer)}</div></div>` : ""}
        ${q.analysis ? `<div class="row"><div class="k">解析</div><div class="v">${fmt(q.analysis)}</div></div>` : ""}
        ${!q.answer && !q.analysis ? `<div class="v" style="color:var(--ink-3)">（该来源未提供答案）</div>` : ""}
      </div>
    </details>`}`;
  const stemEl = card.querySelector(".stem");
  let answered = false;
  card.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      if (answered) return;
      answered = true;
      const k = el.dataset.k;
      if (stemEl && /（[\s\u3000]*）/.test(q.stem || "")) {
        stemEl.innerHTML = fmt((q.stem || "").replace(/（[\s\u3000]*）/, "（" + k + "）"));
      }
      card.querySelectorAll(".opt").forEach(x => x.classList.add("lock"));
      el.classList.add("sel");   // 点击反馈：不管对错都高亮（颜色不区分对错，不泄露正确答案）
      if (!ansLetter) { armAutoNext(); return; }                            // 该题无答案，只做标记不计分
      if (k === ansLetter) scoreRight(q);
      else scoreWrong(q);        // 答错：同样只显示选中色，不标出正确选项
      armAutoNext();
    };
  });
  /* 填空题：点横线弹出按答案定制的小键盘 */
  if (isFill) {
    const blank = $("blankSlot"), pad = $("pad");
    const tokens = answerTokens(q.answer);
    const display = shuffle(tokens.slice());          // 打乱顺序，不按答案原序摆放
    let composed = [];
    const paint = () => { blank.innerHTML = composed.length ? fmt(composed.join("")) : ""; };
    const norm = s => String(s).replace(/\s+/g, "");
    function judge() {
      if (answered) return;
      answered = true;
      pad.classList.add("locked");
      blank.classList.add("sel");   // 提交反馈：不管对错都是同一个颜色，不泄露对错
      if (norm(composed.join("")) === norm(q.answer)) scoreRight(q);
      else scoreWrong(q);           // 答错：不标红、不显示正确答案
      armAutoNext();
    }
    blank.onclick = () => {
      if (answered) return;
      pad.hidden = !pad.hidden;
      if (!pad.childElementCount) {
        pad.innerHTML = display.map(t => `<button class="tk" data-t="${esc(t)}">${fmt(t)}</button>`).join("") +
          `<button class="tk fn" data-fn="del">⌫ 删除</button><button class="tk fn" data-fn="clr">清空</button><button class="tk go" data-fn="ok">确定</button>`;
        pad.querySelectorAll(".tk").forEach(b => {
          b.onclick = () => {
            if (answered) return;
            if (b.dataset.fn === "del") composed.pop();
            else if (b.dataset.fn === "clr") composed.length = 0;
            else if (b.dataset.fn === "ok") { judge(); return; }
            else composed.push(b.dataset.t);
            paint();
          };
        });
      }
    };
  }
  card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
}

/* ---------- 抽题：错题集中的题目抽中概率加大（做对清出错题后权重自动还原） ---------- */
const WRONG_WEIGHT = 4;                 // 错题相对普通题的权重倍数（普通题 = 1）
function wrongIdSet() {
  const ws = (me && Array.isArray(me.wrongItems)) ? me.wrongItems : [];
  return new Set(ws.map(w => String(w.id)));
}
/* 按权重随机取出一道（取出后从池中移除） */
function pickWeighted(arr, wrongIds) {
  if (!arr.length) return null;
  let total = 0;
  const weights = arr.map(q => { const w = wrongIds.has(String(q.id)) ? WRONG_WEIGHT : 1; total += w; return w; });
  let r = Math.random() * total;
  for (let i = 0; i < arr.length; i++) {
    r -= weights[i];
    if (r <= 0) return arr.splice(i, 1)[0];
  }
  return arr.pop();
}

function draw() {
  disarmAutoNext();
  if (!Q.length) { render(null); return; }
  if (!pool.length) refill();
  const wrongIds = wrongIdSet();                 // 每次抽题前按最新错题集取权重
  let q = pickWeighted(pool, wrongIds);
  let guard = Q.length * 3 + 4;
  while (q && drawnIds.has(String(q.id)) && guard-- > 0) {
    if (!pool.length) refill();
    q = pickWeighted(pool, wrongIds);
  }
  if (!q || drawnIds.has(String(q.id))) {
    refill(); drawnIds.clear(); drawn.length = 0;   // 一轮全部抽完，开启新一轮
    q = pickWeighted(pool, wrongIds);
  }
  drawnIds.add(String(q.id));
  saveDrawn();
  current = q;
  drawn.unshift(q);
  render(q); renderHistory(); updateStat();
}

function renderHistory() {
  const wrap = $("historyWrap"), list = $("histList");
  if (!drawn.length) { wrap.hidden = true; return; }
  wrap.hidden = false;
  list.innerHTML = drawn.slice(0, 30).map((q, i) => {
    const s = (q.stem || "").replace(/\s+/g, " ");
    return `<span class="chip${i === 0 ? " now" : ""}" data-id="${q.id}">${esc(s.slice(0, 18) + (s.length > 18 ? "…" : ""))}</span>`;
  }).join("");
  list.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const q = Q.find(x => String(x.id) === String(c.dataset.id));
    if (q) render(q);
  });
}

function updateStat() {
  $("done").textContent = drawn.length;
  $("total").textContent = Q.length;
  $("total2").textContent = Q.length;
}

function reload(list, persist) {
  Q = list.filter(pickable);
  refill(); drawn.length = 0; drawnIds.clear(); saveDrawn(); current = null;
  renderHistory(); updateStat();
  if (Q.length) draw(); else render(null);
  if (persist) { try { localStorage.setItem(KEY, JSON.stringify({ v: VERSION, list: Q })); } catch (e) {} }
}

/* ---------- 导入 / 导出 ---------- */
$("imp").onclick = () => {
  const list = window.parseQuestions($("raw").value);
  if (!list.length) { $("msg").style.color = "#dc2626"; $("msg").textContent = "没解析出题目，检查下编号格式"; return; }
  reload(list, true);
  $("msg").style.color = "#059669";
  $("msg").textContent = "已导入 " + list.length + " 道题";
  $("raw").value = "";
};
$("exp").onclick = () => {
  const txt = "/** 题库（导出于 " + new Date().toLocaleString() + "） */\n"
    + "window.BANK_VERSION = " + JSON.stringify(VERSION) + ";\n"
    + "window.QUESTIONS = " + JSON.stringify(Q, null, 2) + ";\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" }));
  a.download = "questions.js"; a.click();
  URL.revokeObjectURL(a.href);
};
$("clr").onclick = () => {
  localStorage.removeItem(KEY);
  reload((window.QUESTIONS || []).filter(q => q && q.stem), false);
  $("msg").textContent = "已恢复默认题库";
};

$("draw").onclick = draw;
$("reset").onclick = () => { disarmAutoNext(); refill(); drawn.length = 0; drawnIds.clear(); saveDrawn(); current = null; renderHistory(); updateStat(); render(null); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); draw(); }
  if (e.key === "a" || e.key === "A") { const d = $("rev"); if (d) d.open = !d.open; }
});

/* ---------- 点击图片放大 ---------- */
const lb = $("lightbox");
document.addEventListener("click", e => {
  const img = e.target.closest(".figs img, .optimgs img");
  if (img) { lb.querySelector("img").src = img.src; lb.classList.add("on"); return; }
  if (e.target.closest("#lightbox")) lb.classList.remove("on");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });

refill(); updateStat();
if (Q.length) draw(); else render(null);
</script>
</body>
